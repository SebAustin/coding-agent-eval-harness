[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coding_eval"]

[project]
name = "coding-agent-eval-harness"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
  "anthropic==0.40.0",
  "openai==1.57.4",
  "docker==7.1.0",
  "gitpython==3.1.43",
  "sentence-transformers==3.3.1",
  "radon==6.0.1",
  "pydantic==2.9.2",
  "pydantic-settings==2.6.1",
  "httpx==0.28.1",
  "structlog==24.4.0",
  "typer==0.15.1",
  "numpy==2.1.3",
  "rich==13.9.4",
]
[project.optional-dependencies]
dev = ["ruff==0.8.4","mypy==1.13.0","pytest==8.3.4","pytest-asyncio==0.24.0",
       "pytest-cov==6.0.0","respx==0.21.1","pytest-mock==3.14.0"]
# Precompute-only: needed solely to regenerate the SWE-bench contamination
# embeddings via scripts/precompute_contamination.py. Not required at runtime.
contamination = ["datasets==3.2.0"]
[project.scripts]
coding-eval = "coding_eval.cli:app"
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "COM812", "ISC001"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["docker", "docker.*", "radon", "radon.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "INP001", "PT001", "PT023", "TC003", "PLR2004", "S106", "SLF001", "E501", "S108", "ARG002", "PLC0415", "EM101", "EM102", "TRY003"]
"scripts/**/*.py" = ["INP001", "B008", "EXE001", "T201", "PLR2004", "PLR0913", "FBT001", "FBT003"]
"src/coding_eval/cli.py" = ["B008", "I001", "PLR0913", "RUF100", "S311", "PLR2004"]
"src/coding_eval/dataset/builder.py" = ["PLR0913", "PLR0912", "PLR0914", "PLR0915", "C901", "PLR2004", "PLW2901"]
"src/coding_eval/dataset/repos.py" = ["TC003", "PLR2004"]
"src/coding_eval/leaderboard/render.py" = ["PERF401"]
"tests/test_aggregator.py" = ["PLR0913"]
"src/coding_eval/dataset/contamination.py" = ["TC002", "PLR2004"]
"src/coding_eval/dataset/io.py" = ["TC003"]
"src/coding_eval/**/*.py" = ["TC001", "TC002", "FBT001", "FBT003", "S108", "BLE001", "SIM105", "S110"]
"src/coding_eval/patching/git_apply.py" = ["RUF100"]
"src/coding_eval/patching/extract.py" = ["PLR0911", "PLR0912", "PLW2901", "C901"]
"src/coding_eval/agents/aider.py" = ["S603", "S607", "ASYNC221"]
"src/coding_eval/agents/_solver.py" = ["PLR0913", "PLR0912", "PLR0915", "PERF401"]
"src/coding_eval/agents/claude_code.py" = ["PLR0912", "PLR0915", "PERF401"]
"src/coding_eval/agents/context.py" = ["PLR0912", "C901"]
"src/coding_eval/sandbox/runner.py" = []
"src/coding_eval/sandbox/deps.py" = ["S603"]
"src/coding_eval/rubric/style.py" = ["S603", "S607"]
"src/coding_eval/rubric/_patch_files.py" = ["PERF401"]
"src/coding_eval/rubric/scorer.py" = ["PLR0913"]
"src/coding_eval/rubric/semantic.py" = ["PERF401", "C901", "PLR0913"]
"tests/test_claude_code.py" = ["S101", "INP001", "PT001", "PT023", "TC003", "PLR2004", "S106", "SLF001", "E501", "S108", "ARG002", "PLC0415"]
"tests/test_claude_code_cost.py" = ["S101", "INP001", "PT001", "PT023", "TC003", "PLR2004", "S106", "SLF001", "E501", "S108", "ARG002", "PLC0415"]
"tests/test_openai_adapter.py" = ["S101", "INP001", "PT001", "PT023", "TC003", "PLR2004", "S106", "SLF001", "E501", "S108", "ARG002", "PLC0415"]
"tests/test_dataset.py" = ["PLR0911"]
"tests/test_sandbox.py" = ["TRY300"]
"tests/test_patch_validate.py" = ["S101", "INP001"]
[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
norecursedirs = ["fixtures", ".git", "__pycache__", "data"]
markers = ["sandbox: requires Docker (slow)"]
addopts = "--cov=src/coding_eval --cov-fail-under=85 -q -m 'not sandbox'"

[tool.coverage.run]
omit = [
  "src/coding_eval/cli.py",
  "src/coding_eval/agents/*",
  "src/coding_eval/sandbox/*",
  "src/coding_eval/dataset/builder.py",
]

