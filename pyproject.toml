[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coding_eval"]

[project]
name = "coding-agent-eval-harness"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
  "anthropic==0.40.0",
  "openai==1.53.0",
  "docker==7.1.0",
  "gitpython==3.1.43",
  "tree-sitter==0.23.0",
  "sentence-transformers==3.3.1",
  "radon==6.0.1",
  "pydantic==2.9.2",
  "pydantic-settings==2.6.1",
  "httpx==0.28.1",
  "structlog==24.4.0",
  "typer==0.15.1",
  "langsmith==0.2.10",
  "numpy==2.1.3",
  "rich==13.9.4",
  "datasets==3.2.0",
]
[project.optional-dependencies]
dev = ["ruff==0.8.4","mypy==1.13.0","pytest==8.3.4","pytest-asyncio==0.24.0",
       "pytest-cov==6.0.0","respx==0.21.1","pytest-mock==3.14.0"]
[project.scripts]
coding-eval = "coding_eval.cli:app"
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "ANN101", "COM812", "ISC001"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["docker", "docker.*", "datasets", "datasets.*", "radon", "radon.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "INP001", "PT001", "PT023", "TC003", "PLR2004", "S106"]
"scripts/**/*.py" = ["INP001", "B008"]
"src/coding_eval/cli.py" = ["B008"]
"src/coding_eval/dataset/contamination.py" = ["TC002", "PLR2004"]
"src/coding_eval/dataset/io.py" = ["TC003"]
"src/coding_eval/**/*.py" = ["TC001", "TC002", "FBT001", "FBT003", "S108", "BLE001", "SIM105", "S110"]
"src/coding_eval/patching/git_apply.py" = ["RUF100"]
"src/coding_eval/agents/aider.py" = ["S603", "S607"]
"src/coding_eval/sandbox/runner.py" = []
"src/coding_eval/rubric/style.py" = ["S603", "S607"]
"tests/test_contamination.py" = ["FBT001", "FBT002", "ARG002"]
[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
norecursedirs = ["fixtures", ".git", "__pycache__", "data"]
markers = ["sandbox: requires Docker (slow)"]
addopts = "--cov=src/coding_eval --cov-fail-under=85 -q -m 'not sandbox'"

[tool.coverage.run]
omit = [
  "src/coding_eval/cli.py",
  "src/coding_eval/agents/*",
  "src/coding_eval/sandbox/*",
]

