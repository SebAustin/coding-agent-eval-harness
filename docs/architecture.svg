<svg viewBox="0 0 680 884" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>coding-agent-eval-harness — detailed pipeline</title>
  <desc>Detailed architecture: a Dataset and Contamination stage feeds the runner; the runner dispatches to four agents, where single-shot claude-code and openai route through a shared _solver before emitting a patch while claude-code-agentic and aider emit a patch directly; the patch runs in an isolated Docker sandbox; a 5-axis rubric (with a Claude judge for the semantic axis) scores it onto the leaderboard.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5F5E5A"/>
    </marker>
  </defs>

  <!-- ============ PANEL BACKGROUNDS ============ -->
  <g stroke-dasharray="4 3" stroke-width="1.25">
    <rect x="16" y="34" width="648" height="132" rx="12" fill="#F4F9FE" stroke="#85B7EB"/>
    <rect x="16" y="186" width="648" height="362" rx="12" fill="#F6FAEF" stroke="#97C459"/>
    <rect x="16" y="568" width="648" height="86" rx="12" fill="#FEF4F4" stroke="#F09595"/>
    <rect x="16" y="674" width="648" height="194" rx="12" fill="#F8F5FE" stroke="#AFA9EC"/>
  </g>
  <g font-size="10" font-weight="700" letter-spacing="0.5">
    <text x="30" y="52" fill="#185FA5">DATASET &amp; CONTAMINATION</text>
    <text x="30" y="204" fill="#3B6D11">AGENTS (HOST)</text>
    <text x="30" y="586" fill="#A32D2D">ISOLATED EXECUTION — DOCKER SANDBOX</text>
    <text x="30" y="692" fill="#534AB7">SCORING &amp; OUTPUT</text>
  </g>

  <!-- ============ ARROWS (drawn under nodes) ============ -->
  <g stroke="#888780" stroke-width="1.75" fill="none" marker-end="url(#ar)">
    <!-- panel 1 internal -->
    <line x1="232" y1="84" x2="328" y2="100"/>
    <line x1="232" y1="130" x2="328" y2="122"/>
    <!-- contam -> runner -->
    <line x1="435" y1="142" x2="428" y2="212"/>
    <!-- runner -> adapters -->
    <line x1="428" y1="252" x2="120" y2="298"/>
    <line x1="428" y1="252" x2="255" y2="298"/>
    <line x1="428" y1="252" x2="419" y2="298"/>
    <line x1="428" y1="252" x2="578" y2="298"/>
    <!-- cc, oa -> solver -->
    <line x1="106" y1="350" x2="135" y2="391"/>
    <line x1="250" y1="350" x2="220" y2="391"/>
    <!-- solver -> patch ; cca -> patch ; adr -> patch -->
    <line x1="281" y1="424" x2="338" y2="488"/>
    <line x1="419" y1="350" x2="402" y2="468"/>
    <line x1="586" y1="350" x2="462" y2="484"/>
    <!-- patch -> sandbox -->
    <line x1="400" y1="512" x2="372" y2="594"/>
    <!-- sandbox -> rubric -->
    <line x1="330" y1="644" x2="160" y2="704"/>
    <!-- rubric -> leader ; rubric -> semantic -->
    <line x1="260" y1="748" x2="468" y2="746"/>
    <line x1="150" y1="798" x2="338" y2="806"/>
  </g>

  <!-- ============ ARROW LABELS ============ -->
  <g font-size="8.5" fill="#444441" text-anchor="middle">
    <rect x="150" y="366" width="66" height="14" rx="7" fill="#F1EFE8"/><text x="183" y="376">completes via</text>
    <rect x="378" y="546" width="34" height="14" rx="7" fill="#F1EFE8"/><text x="395" y="556">patch</text>
    <rect x="232" y="668" width="34" height="14" rx="7" fill="#F1EFE8"/><text x="249" y="678">score</text>
    <rect x="348" y="731" width="34" height="14" rx="7" fill="#F1EFE8"/><text x="365" y="741">score</text>
  </g>

  <!-- ============ NODES ============ -->
  <!-- Panel 1: input (blue) -->
  <g>
    <rect x="44" y="66" width="188" height="36" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
    <text x="138" y="82" text-anchor="middle" font-size="11" font-weight="600" fill="#042C53">seed_50.jsonl</text>
    <text x="138" y="95" text-anchor="middle" font-size="8" fill="#185FA5">20 PR-issue pairs</text>

    <rect x="44" y="112" width="188" height="36" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
    <text x="138" y="128" text-anchor="middle" font-size="10.5" font-weight="600" fill="#042C53">SWE-bench train</text>
    <text x="138" y="140" text-anchor="middle" font-size="8" fill="#185FA5">embeddings (.npz)</text>

    <rect x="330" y="78" width="210" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
    <text x="435" y="104" text-anchor="middle" font-size="11.5" font-weight="600" fill="#042C53">contamination.py</text>
    <text x="435" y="122" text-anchor="middle" font-size="9" fill="#185FA5">cosine sim &gt; 0.85 vs train</text>
  </g>

  <!-- Panel 2: agents (green) + solver (amber) -->
  <g>
    <rect x="362" y="214" width="132" height="38" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
    <text x="428" y="231" text-anchor="middle" font-size="11.5" font-weight="600" fill="#173404">Runner</text>
    <text x="428" y="244" text-anchor="middle" font-size="8" fill="#3B6D11">task loop</text>

    <rect x="36" y="300" width="140" height="50" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
    <text x="106" y="320" text-anchor="middle" font-size="11" font-weight="600" fill="#173404">claude-code</text>
    <text x="106" y="334" text-anchor="middle" font-size="8" fill="#3B6D11">single-shot · Anthropic</text>

    <rect x="190" y="300" width="120" height="50" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
    <text x="250" y="320" text-anchor="middle" font-size="11" font-weight="600" fill="#173404">openai</text>
    <text x="250" y="334" text-anchor="middle" font-size="8" fill="#3B6D11">single-shot · OpenAI</text>

    <rect x="324" y="300" width="190" height="50" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
    <text x="419" y="320" text-anchor="middle" font-size="11" font-weight="600" fill="#173404">claude-code-agentic</text>
    <text x="419" y="334" text-anchor="middle" font-size="8" fill="#3B6D11">tool loop · read/grep/list</text>

    <rect x="528" y="300" width="116" height="50" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
    <text x="586" y="320" text-anchor="middle" font-size="11" font-weight="600" fill="#173404">aider</text>
    <text x="586" y="334" text-anchor="middle" font-size="8" fill="#3B6D11">CLI subprocess</text>

    <polygon points="93,393 259,393 281,422 259,451 93,451 71,422" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/>
    <text x="176" y="418" text-anchor="middle" font-size="11" font-weight="600" fill="#412402">_solver.py</text>
    <text x="176" y="432" text-anchor="middle" font-size="8" fill="#854F0B">apply-check · fixup · retry</text>

    <rect x="340" y="470" width="120" height="42" rx="11" fill="#F0F4E8" stroke="#3B6D11" stroke-width="1.5"/>
    <text x="400" y="495" text-anchor="middle" font-size="11" font-weight="600" fill="#173404">patch string</text>
  </g>

  <!-- Panel 3: sandbox (red) -->
  <g>
    <rect x="196" y="596" width="308" height="48" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.5"/>
    <text x="350" y="616" text-anchor="middle" font-size="11.5" font-weight="600" fill="#501313">Docker sandbox</text>
    <text x="350" y="632" text-anchor="middle" font-size="8" fill="#A32D2D">git apply + pytest · net=none · 512m · 1 CPU</text>
  </g>

  <!-- Panel 4: scoring (purple) + output (teal) -->
  <g>
    <rect x="44" y="706" width="216" height="92" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
    <text x="152" y="728" text-anchor="middle" font-size="11.5" font-weight="600" fill="#26215C">5-axis Rubric</text>
    <text x="152" y="748" text-anchor="middle" font-size="8.5" fill="#534AB7">test 35 · diff 15 · cplx 15</text>
    <text x="152" y="762" text-anchor="middle" font-size="8.5" fill="#534AB7">style 15 · semantic 20</text>
    <text x="152" y="778" text-anchor="middle" font-size="7.5" fill="#7F77DD">(weights, %)</text>

    <rect x="300" y="804" width="160" height="44" rx="11" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
    <text x="380" y="822" text-anchor="middle" font-size="10" font-weight="600" fill="#26215C">Claude judge</text>
    <text x="380" y="836" text-anchor="middle" font-size="8" fill="#534AB7">semantic axis</text>

    <rect x="470" y="716" width="156" height="60" rx="30" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
    <text x="548" y="742" text-anchor="middle" font-size="11.5" font-weight="600" fill="#04342C">Leaderboard</text>
    <text x="548" y="757" text-anchor="middle" font-size="8" fill="#0F6E56">results/*.md · .json</text>
  </g>
</svg>
